<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Final Project - Pro Shop Bowling Balls</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Final Project: The Pro Shop</h1>
  </header>

  <!-- FILTER SECTION -->
  <section id="filters">

    <h3>Filter Balls</h3>

    <select id="brandFilter">
      <option value="">All Brands</option>
    </select>

    <select id="oilFilter">
      <option value="">All Oil Ratings</option>
    </select>

    <select id="motionFilter">
      <option value="">All Ball Motions</option>
    </select>

  </section>

  <hr>

  <!-- PRODUCT GRID -->
  <main>
    <div id="ball-container"></div>
  </main>

  <hr>

  <!-- CART SECTION (BOTTOM OF PAGE) -->
  <footer id="cart">

    <h2>Cart (0)</h2>

    <div id="cart-items"></div>

    <h3 id="cart-total">Total: $0</h3>

    <button onclick="goToCheckout()">
      Proceed to Checkout
    </button>

  </footer>

  <script src="script.js"></script>

</body>
</html>
