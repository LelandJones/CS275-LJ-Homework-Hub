<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Final Project - Pro Shop Bowling Balls</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>The Pro's Shop</h1>
    <h2>Bowling Ball Catalog System</h2>
  </header>

  <!-- FILTER SECTION -->
  <section id="filters">
    <h3>Filter Balls</h3>

    <select id="brandFilter">
      <option value="">All Brands</option>
    </select>

    <select id="oilFilter">
      <option value="">All Oil Ratings</option>
    </select>

    <select id="motionFilter">
      <option value="">All Ball Motions</option>
    </select>
  </section>


  <!-- BALL DISPLAY -->
  <main>
    <div id="ball-container"></div>
  </main>


  <!-- CART SECTION -->
  <footer id="cart">
    <h2>Cart (0)</h2>

    <div id="cart-items"></div>

    <h3 id="cart-total">Total: $0</h3>

    <button onclick="goToCheckout()">
      Proceed to Checkout
    </button>
  </footer>


  <!-- Test Button -->
  <button onclick="runTests()">Run Tests</button>
  <div id="test-results"></div>

  <!-- JS SCRIPTS -->
  <script src="script.js"></script>

</body>
</html>
